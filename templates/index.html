<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask AI Research Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .chat-header h1 {
            color: #333;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .chat-header p {
            color: #666;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            margin: 1rem auto 0;
            width: calc(100% - 2rem);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .messages-container {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 75%;
            padding: 1rem 1.25rem;
            border-radius: 20px;
            position: relative;
            word-wrap: break-word;
            animation: messageSlideIn 0.3s ease-out;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        @keyframes messageSlideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 6px;
        }

        .message.bot {
            align-self: flex-start;
            background: #f8f9fa;
            color: #333;
            border-bottom-left-radius: 6px;
            border-left: 4px solid #667eea;
        }

        .message-time {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-top: 0.5rem;
        }

        .input-container {
            padding: 1.5rem;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.98);
            display: flex;
            gap: 0.75rem;
            align-items: flex-end;
        }

        .message-input {
            flex: 1;
            padding: 1rem 1.25rem;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            outline: none;
            font-size: 1rem;
            resize: none;
            min-height: 48px;
            max-height: 120px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .message-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .send-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .send-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }

        .send-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .send-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .ai-status {
            display: none;
            align-self: flex-start;
            padding: 1rem 1.25rem;
            background: rgba(102, 126, 234, 0.1);
            border: 2px solid rgba(102, 126, 234, 0.2);
            border-radius: 20px;
            border-bottom-left-radius: 6px;
            max-width: 75%;
            animation: messageSlideIn 0.3s ease-out;
        }

        .ai-status.active {
            display: block;
        }

        .status-content {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #667eea;
            font-weight: 500;
        }

        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(102, 126, 234, 0.3);
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 1rem 1.25rem;
            background: #f8f9fa;
            border-radius: 20px;
            border-bottom-left-radius: 6px;
            max-width: 75%;
            border-left: 4px solid #667eea;
            animation: messageSlideIn 0.3s ease-out;
        }

        .typing-indicator.active {
            display: block;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .typing-dots div {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dots div:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots div:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typing {
            0%, 80%, 100% {
                transform: scale(0.3);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .welcome-message {
            text-align: center;
            padding: 2rem;
            color: #666;
            font-style: italic;
        }

        /* Scrollbar styling */
        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 3px;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.3);
            border-radius: 3px;
        }

        .messages-container::-webkit-scrollbar-thumb:hover {
            background: rgba(102, 126, 234, 0.5);
        }

        @media (max-width: 768px) {
            .chat-container {
                margin: 0.5rem auto 0;
                width: calc(100% - 1rem);
                border-radius: 15px 15px 0 0;
            }

            .message {
                max-width: 85%;
                padding: 0.875rem 1rem;
            }

            .messages-container {
                padding: 1rem;
            }

            .input-container {
                padding: 1rem;
            }

            .chat-header {
                padding: 1rem;
            }

            .chat-header h1 {
                font-size: 1.5rem;
            }
        }

        /* Pulse animation for send button when typing */
        .send-button.pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3); }
            50% { box-shadow: 0 4px 16px rgba(102, 126, 234, 0.5); }
            100% { box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3); }
        }
    </style>
</head>
<body>
    <div class="chat-header">
        <h1>🤖 AI Research Assistant</h1>
        <p>Your intelligent companion for research, analysis, and information gathering</p>
    </div>

    <div class="chat-container">
        <div class="messages-container" id="messages">
            <div class="message bot">
                <div>👋 Hello! I'm your AI research assistant. I can help you with research, data analysis, web scraping, and compiling comprehensive reports. What would you like to explore today?</div>
                <div class="message-time" id="initial-time"></div>
            </div>
        </div>

        <div class="ai-status" id="aiStatus">
            <div class="status-content">
                <div class="loading-spinner"></div>
                <span id="statusText">Processing...</span>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dots">
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>

        <div class="input-container">
            <textarea
                class="message-input"
                id="messageInput"
                placeholder="Ask me to research anything, analyze data, or compile information..."
                rows="1"
            ></textarea>
            <button class="send-button" id="sendButton" title="Send message">
                ➤
            </button>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const aiStatus = document.getElementById('aiStatus');
        const statusText = document.getElementById('statusText');
        const typingIndicator = document.getElementById('typingIndicator');

        // Set initial timestamp
        document.getElementById('initial-time').textContent = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

        let lastMessageCount = 0;
        let isWaitingForResponse = false;

        // Auto-resize textarea
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';

            // Add pulse effect when typing
            if (this.value.trim()) {
                sendButton.classList.add('pulse');
            } else {
                sendButton.classList.remove('pulse');
            }
        });

        // Send message on Enter (but allow Shift+Enter for new line)
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendButton.addEventListener('click', sendMessage);

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || isWaitingForResponse) return;

            // Immediately add user message to chat
            addUserMessageToChat(message, new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}));

            // Clear input and reset
            messageInput.value = '';
            messageInput.style.height = 'auto';
            sendButton.classList.remove('pulse');

            // Set waiting state
            isWaitingForResponse = true;
            updateUIState(true);

            try {
                const response = await fetch('/send_message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });

                if (response.ok) {
                    showAIStatus();
                    startStatusPolling();
                } else {
                    throw new Error('Failed to send message');
                }
            } catch (error) {
                console.error('Error sending message:', error);
                hideAllIndicators();
                isWaitingForResponse = false;
                updateUIState(false);
            }
        }

        function addUserMessageToChat(text, timestamp) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user';
            messageDiv.innerHTML = `
                <div>${text}</div>
                <div class="message-time">${timestamp}</div>
            `;
            messagesContainer.appendChild(messageDiv);
            lastMessageCount++;
            scrollToBottom();
        }

        function addBotMessageToChat(message) {
    const messageDiv = document.createElement('div');
    messageDiv.className = 'message bot';

    let content = message.text;
    if (content.startsWith('http')) {
        content = `<a href="${content}" target="_blank">${content}</a>`;
    }

    messageDiv.innerHTML = `
        <div>${content}</div>
        <div class="message-time">${message.timestamp}</div>
    `;
    messagesContainer.appendChild(messageDiv);
}

        function showAIStatus() {
            aiStatus.classList.add('active');
            scrollToBottom();
        }

        function hideAIStatus() {
            aiStatus.classList.remove('active');
        }

        function showTypingIndicator() {
            typingIndicator.classList.add('active');
            scrollToBottom();
        }

        function hideTypingIndicator() {
            typingIndicator.classList.remove('active');
        }

        function hideAllIndicators() {
            hideAIStatus();
            hideTypingIndicator();
        }

        function updateUIState(waiting) {
            messageInput.disabled = waiting;
            sendButton.disabled = waiting;

            if (!waiting) {
                messageInput.focus();
            }
        }

        async function loadMessages() {
            try {
                const response = await fetch('/get_messages');
                const messages = await response.json();

                if (messages.length > lastMessageCount) {
                    const newMessages = messages.slice(lastMessageCount);
                    newMessages.forEach(message => {
                        if (message.sender === 'bot') {
                            hideAllIndicators();
                            addBotMessageToChat(message);
                            isWaitingForResponse = false;
                            updateUIState(false);
                        }
                    });
                    lastMessageCount = messages.length;
                    scrollToBottom();
                }
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        async function checkStatus() {
            try {
                const response = await fetch('/get_status');
                const status = await response.json();

                if (status.active && status.message) {
                    statusText.textContent = status.message;
                    if (!aiStatus.classList.contains('active')) {
                        showAIStatus();
                    }
                } else if (!status.active) {
                    hideAIStatus();
                    if (isWaitingForResponse) {
                        showTypingIndicator();
                    }
                }
            } catch (error) {
                console.error('Error checking status:', error);
            }
        }

        function startStatusPolling() {
            const statusInterval = setInterval(async () => {
                await checkStatus();
                await loadMessages();

                if (!isWaitingForResponse) {
                    clearInterval(statusInterval);
                }
            }, 500);
        }

        function scrollToBottom() {
            requestAnimationFrame(() => {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
        }

        // Focus on input when page loads
        window.addEventListener('load', () => {
            messageInput.focus();
        });

        // Periodic message check for multi-user scenarios
        setInterval(loadMessages, 3000);
    </script>
</body>
</html>
